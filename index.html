<style>
  :root{
    --cream:#F4EEE1; --cream-dusk:#EDE0C8;
    --ink:#3D4A32; --ink-soft:#6B6754; --muted:#8A8570; --muted-light:#B5AD94;
    --border:#DCD3BC; --sage-1:#A9C68A; --sage-2:#8FAE72; --sage-3:#6E9153;
    --terracotta:#D98B5F; --dusk-bg:#3D3426; --dusk-text:#F4EEE1; --paper:#FFFDF8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
    background:#E9E2D0; color:var(--ink); display:flex; justify-content:center; min-height:100vh; min-height:100dvh;
  }
  #phone{
    width:100%; max-width:390px; min-height:100vh; min-height:100dvh; background:var(--paper);
    position:relative; overflow:hidden; display:flex; flex-direction:column;
  }
  #screen{flex:1; display:flex; flex-direction:column; position:relative}
  .view{flex:1; display:flex; flex-direction:column; padding:calc(1.5rem + env(safe-area-inset-top,0px)) 1.25rem 1.5rem; animation:fadeIn .35s ease}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)}}
  @media (prefers-reduced-motion: reduce){ .view{animation:none} }

  .eyebrow{font-size:11px; color:var(--muted-light); margin:0 0 18px}
  h1{font-size:19px; font-weight:600; color:var(--ink); margin:0 0 14px; line-height:1.6}
  p.copy{font-size:14px; color:var(--ink-soft); line-height:1.8; margin:0 0 14px}
  p.small{font-size:12px; color:var(--muted); line-height:1.7}

  .btn{
    width:100%; border:none; border-radius:24px; padding:13px; font-size:14px;
    background:var(--terracotta); color:#FFF7EE; cursor:pointer; font-weight:500;
  }
  .btn:active{opacity:.85}
  .btn.ghost{background:#fff; color:var(--ink); border:1px solid var(--border)}
  .btn.block{margin-bottom:8px}
  .spacer{flex:1}

  .chip-row{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:20px}
  .chip{
    font-size:12px; padding:7px 12px; border-radius:16px; border:1px solid var(--border);
    color:var(--muted); background:#fff; cursor:pointer;
  }
  .chip.active{background:var(--terracotta); color:#FFF7EE; border-color:var(--terracotta)}
  .chip-age{
    display:flex; flex-direction:column; align-items:center; gap:2px; min-width:56px;
    font-size:13px; padding:8px 10px; border-radius:12px; border:1px solid var(--border);
    color:var(--muted); background:#fff; cursor:pointer;
  }
  .chip-age small{font-size:9px; color:var(--muted-light)}
  .chip-age.active{background:var(--terracotta); color:#FFF7EE; border-color:var(--terracotta)}
  .chip-age.active small{color:rgba(255,247,238,.8)}

  .toggle-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:22px}
  .toggle-row .label{font-size:13px; color:var(--ink)}
  .toggle-row .sub{font-size:11px; color:var(--muted-light); margin-top:3px}
  .switch{width:38px; height:21px; border-radius:11px; position:relative; cursor:pointer; transition:.2s}
  .switch .knob{width:17px; height:17px; background:#fff; border-radius:50%; position:absolute; top:2px; transition:.2s}
  .switch.off{background:var(--border)} .switch.off .knob{left:2px}
  .switch.on{background:var(--sage-2)} .switch.on .knob{left:19px}

  .dots{display:flex; gap:6px; justify-content:center; margin-top:14px}
  .dots span{width:6px; height:6px; border-radius:50%; background:var(--border)}
  .dots span.on{background:var(--terracotta)}

  /* camera */
  .cam-circle{
    width:72px; height:72px; border-radius:50%; background:var(--cream); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; margin:auto; font-size:28px;
  }
  .thumb-row{display:flex; gap:6px; margin-bottom:14px; overflow-x:auto}
  .thumb{width:46px; height:46px; border-radius:8px; background:var(--cream-dusk); flex-shrink:0; position:relative}
  .thumb-del{
    position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%;
    background:#fff; border:1px solid var(--border); font-size:11px; line-height:16px;
    text-align:center; color:var(--muted); cursor:pointer;
  }

  /* dusk screens */
  .dusk{background:var(--dusk-bg); color:var(--dusk-text); margin:-1.5rem -1.25rem; padding:calc(1.5rem + env(safe-area-inset-top,0px)) 1.25rem 1.5rem; flex:1; display:flex; flex-direction:column}
  .dusk .eyebrow{color:rgba(244,238,225,.5)}
  .dusk .copy{color:rgba(244,238,225,.85)}
  .progress{display:flex; gap:4px; margin-bottom:16px}
  .progress div{flex:1; height:3px; border-radius:2px; background:rgba(255,255,255,.35)}
  .progress div.done{background:rgba(255,255,255,.9)}
  .story-photo{
    aspect-ratio:1; border-radius:12px; background:rgba(255,255,255,.08); position:relative;
    display:flex; align-items:center; justify-content:center; font-size:34px; margin-bottom:14px;
  }
  .badge{position:absolute; top:8px; right:8px; background:rgba(0,0,0,.5); border-radius:10px; padding:3px 9px; font-size:10px}
  .story-nav{position:absolute; top:0; bottom:0; width:35%}
  .id-tag{font-size:11px; color:var(--terracotta); margin-bottom:6px}

  /* garden */
  .garden-plot{
    background:var(--cream); border-radius:16px; padding:1.25rem; margin-bottom:16px; position:relative; overflow:hidden;
  }
  .garden-plot.full{border:2px dashed var(--border)}
  .plants{display:flex; align-items:flex-end; justify-content:space-around; height:120px; font-size:34px; margin-bottom:6px}
  .ghost-plant{position:absolute; bottom:14px; right:16px; font-size:30px; opacity:.22}
  .swipe-hint{text-align:center; font-size:11px; color:var(--muted-light); margin-top:4px}
  .current-week{position:relative; display:inline-block}
  .current-week::after{
    content:''; position:absolute; inset:-9px; border:2px solid var(--terracotta); border-radius:50%;
  }

  /* —— 對齊 Figma（frames 5 / 8 / 9 / 10）—— */
  #backBtn + .view .eyebrow{padding-left:36px}
  .plant-svg{filter:drop-shadow(1px 2px 1.5px rgba(61,46,26,.22))}
  .more-row{display:flex; align-items:center; justify-content:center; gap:14px; margin-top:16px; align-self:center}
  .mini-btn{width:42px; height:42px; border-radius:50%; background:var(--cream); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; cursor:pointer}
  .mini-btn svg{pointer-events:none}
  .more-row .side{display:none}
  .more-row.open .side{display:flex}
  .plant-block{display:inline-flex; align-items:flex-end; flex-shrink:0; cursor:pointer; padding:2px}
  .plant-block svg{pointer-events:none; display:block; overflow:visible}
  .invite-card{
    position:relative; min-height:176px; background:var(--cream); border-radius:18px; padding:18px 18px 16px;
    display:flex; flex-direction:column; justify-content:space-between;
    box-shadow:0 6px 14px rgba(61,52,38,.16), 0 1px 2px rgba(61,52,38,.1);
  }
  .invite-card h1{font-size:17px; margin:0}
  .invite-ghost{position:absolute; top:8px; right:10px; opacity:.3; pointer-events:none}
  .cam-circle.big{
    width:96px; height:96px; border:none;
    box-shadow:6px 8px 16px rgba(61,52,38,.2), -4px -4px 10px rgba(255,255,255,.75);
  }
  .week-head{display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-bottom:8px}
  .week-card{
    background:var(--cream); border-radius:14px; padding:14px 12px 10px; min-height:64px;
    display:flex; gap:10px; align-items:flex-end; overflow-x:auto;
    box-shadow:0 4px 10px rgba(61,52,38,.14);
  }
  .hero-photo{aspect-ratio:1; border-radius:14px; background:var(--cream-dusk) center/cover; margin-bottom:14px}
  #backBtn + .view .hero-photo{margin-top:36px}
  .story-photo{overflow:hidden}
  .badge{z-index:2; cursor:pointer}
  .garden-plot.near{background:none; padding:0; overflow:visible; margin-bottom:8px}
  .garden-plot.near .ghost-plant{top:0; bottom:auto; right:0; opacity:.3}
  .swipe-hint{line-height:1.9}

  #overlay{position:absolute; inset:0; z-index:30; display:none; flex-direction:column; padding:14px 12px; background:rgba(20,16,10,.62); animation:fadeIn .25s ease}
  #overlay .dusk{margin:0; border-radius:18px; overflow:hidden}

  /* nav bar (prototype helper) */
  #devnav{
    display:flex; border-top:1px solid var(--border); background:#fff; padding-bottom:env(safe-area-inset-bottom,0px);
  }
  #devnav button{
    flex:1; border:none; background:none; padding:11px 4px; font-size:10.5px; color:var(--muted);
    cursor:pointer; border-top:2px solid transparent;
  }
  #devnav button.active{color:var(--terracotta); border-top-color:var(--terracotta)}
  #devnav button#todToggle{color:var(--muted-light); font-size:10px; border-left:1px solid var(--border)}
</style>
</head>

function getWeekStartISO(d=new Date()){
  const diff = (d.getDay()===0 ? -6 : 1) - d.getDay();
  const m = new Date(d.getFullYear(), d.getMonth(), d.getDate()+diff);   // 本地時間的週一
  const p = n => String(n).padStart(2,'0');
  return `${m.getFullYear()}-${p(m.getMonth()+1)}-${p(m.getDate())}`;     // 不經過 toISOString，避免換成 UTC
}

async function saveEntry({note=null, species=null, confidence=null}){
  if(!currentUser){ console.warn('未登入，這則不會存進 Supabase，僅本機顯示'); return null; }
  const { data, error } = await sb.from('entries').insert({
    user_id: currentUser.id, note: note||null, species, ai_confidence: confidence,
    week_start: getWeekStartISO()
  }).select().single();
  if(error){ console.error(error); return null; }

  for(let i=0; i<state.photos.length; i++){
    const file = state.photos[i];
    const path = `${currentUser.id}/${data.id}/${i}-${Date.now()}.jpg`;
    const { error: upErr } = await sb.storage.from('entry-photos').upload(path, file);
    if(upErr){ console.error('照片上傳失敗', upErr); continue; }
    await sb.from('entry_photos').insert({ entry_id: data.id, storage_path: path, sort_order: i });
  }
  return data;
}

let weekEntries = [];
async function loadWeekEntries(){
  if(!currentUser){ weekEntries = []; return; }
  const { data, error } = await sb.from('entries').select('*, entry_photos(storage_path, sort_order)')
    .eq('user_id', currentUser.id).eq('week_start', getWeekStartISO()).order('created_at');
  weekEntries = error ? [] : (data||[]);
  const paths = weekEntries.flatMap(e => (e.entry_photos||[]).sort((a,b)=>a.sort_order-b.sort_order).map(p=>p.storage_path));
  if(paths.length){
    const { data: signed } = await sb.storage.from('entry-photos').createSignedUrls(paths, 3600);
    const map = Object.fromEntries((signed||[]).filter(x=>x.signedUrl).map(x=>[x.path, x.signedUrl]));
    weekEntries.forEach(e => { e.urls = (e.entry_photos||[]).map(p=>map[p.storage_path]).filter(Boolean); });
  }
}

const devOverride = {weather:null, date:null};   // 開發測試：手動指定天氣 / 日期
function invDate(){
  if(devOverride.date){ const [y,m,d] = devOverride.date.split('-').map(Number); return {y, m, d}; }
  const n = new Date(); return {y:n.getFullYear(), m:n.getMonth()+1, d:n.getDate()};
}
function seededRand(n){
  let x = (n ^ 0x9e3779b9) >>> 0;
  x = Math.imul(x ^ (x>>>16), 0x85ebca6b); x = Math.imul(x ^ (x>>>13), 0xc2b2ae35); x ^= x>>>16;
  return (x>>>0)/4294967296;
}
function currentSolarTerm(m, d){
  let cur = SOLAR_TERMS[SOLAR_TERMS.length-1];       // 一月初之前，沿用前一年的冬至
  for(const t of SOLAR_TERMS){ if(t[0]<m || (t[0]===m && t[1]<=d)) cur = t; }
  return cur;
}
// 一天一句、同一天內固定；三層合併的加權抽選（區域句符合時權重最高，節氣句不會被區域句擠掉）
function todayInvitation(){
  const {y,m,d} = invDate();
  const dayNum = Math.floor(Date.UTC(y, m-1, d)/86400000);
  const w = devOverride.weather || null;
  if(w==='severe') return {main: SEVERE_LINE, sub: null, ids:['severe']};
  const daily = DAILY_LINES[((dayNum % DAILY_LINES.length)+DAILY_LINES.length) % DAILY_LINES.length];
  const pool = [];
  if(w && WEATHER_LINES[w]) WEATHER_LINES[w].forEach(([id,t])=> pool.push({id, t, wt:1}));
  REGION_LINES.forEach(r=>{
    if(state.region && r.regions.includes(state.region)
       && (!r.months || r.months.includes(m)) && (!r.weathers || !w || r.weathers.includes(w)))
      pool.push({id:r.id, t:r.t, wt:3});
  });
  const st = currentSolarTerm(m, d);
  if(!st[4] || (w && st[4].includes(w))) pool.push({id:st[2], t:st[3], wt:2});
  let sub = null;
  if(pool.length){
    const total = pool.reduce((s,p)=>s+p.wt, 0);
    let r = seededRand(dayNum + 7919) * total;
    for(const p of pool){ r -= p.wt; if(r < 0){ sub = p; break; } }
    sub = sub || pool[pool.length-1];
  }
  return {main: daily[1], sub: sub ? sub.t : null, ids:[daily[0], sub ? sub.id : null]};
}

function plantIcon(entry, size=30, variant='stem'){

    const R = size/2, s = R/39, fr = (MINI_FLOWER_RATIO*size/2)/1.12;   // 花瓣外緣約 1.12r

    if(!note) return `<svg class="plant-svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${c}</svg>`;

    const fc = R + size*0.47, W = fc + MINI_FLOWER_RATIO*size/2;
    return `<svg class="plant-svg" width="${W}" height="${W}" viewBox="0 0 ${W} ${W}">${c}<g transform="translate(${fc},${fc})">${flowerG(fr)}</g></svg>`;

}

// 本週近景：一週一株，每則紀錄一根莖＋一組三葉；
// 只有 1 則附文字 → 頂端一朵大花；多則附文字 → 各自葉腋旁一朵小花
function weekPlantSVG(entries){
  const n = entries.length, bx = 150, by = 285;
  const pts = entries.map((e,i)=>{
    const t = n===1 ? 0 : (i/(n-1)-.5)*2;
    const a = t*50*Math.PI/180, L = 170 - Math.abs(t)*50;
    const tx = bx+L*Math.sin(a), ty = by-L*Math.cos(a);
    return {e, t, a, L, tx, ty, cx: bx+(tx-bx)*.15, cy: by-L*.6};
  });
  const flowering = pts.filter(p=>p.e.text && p.e.text.trim());
  const stem = d => `<path d="${d}" stroke="#6E9153" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  const stems = pts.map(p=>stem(`M${bx},${by} Q${p.cx},${p.cy} ${p.tx},${p.ty}`)).join('');
  const clovers = pts.map(p=>`<g transform="translate(${p.tx},${p.ty}) rotate(${p.t*30}) scale(1.1)">${cloverG(p.e.kind==='id')}</g>`).join('');
  let fStems = '', fHeads = '';
  if(flowering.length===1){
    // 單朵：大花開在頂端，花莖由底部筆直長出
    fStems = stem(`M${bx},${by} L${bx},50`);
    fHeads = `<g transform="translate(${bx},34)">${flowerG(22)}</g>`;
  }else{
    // 多朵：每朵小花都有自己的花莖由底部長出，比對應的葉子再高一些、略偏向外側
    flowering.forEach(p=>{
      const fL = p.L+40, fa = p.a + (p.t<0 ? -.18 : .18);
      const fx = Math.max(24, Math.min(276, bx+fL*Math.sin(fa))), fy = by-fL*Math.cos(fa);
      fStems += stem(`M${bx},${by} Q${bx+(fx-bx)*.15},${by-fL*.6} ${fx},${fy}`);
      fHeads += `<g transform="translate(${fx},${fy})">${flowerG(11)}</g>`;
    });
  }
  return `<svg class="plant-svg" viewBox="0 0 300 300" width="100%" style="display:block">
    <ellipse cx="150" cy="212" rx="128" ry="82" fill="#EDE0C8" opacity=".7"/>${stems}${fStems}${clovers}${fHeads}</svg>`;
}

function bind(view){
  screenEl.querySelectorAll('[data-go]').forEach(el=>{
    el.onclick = ()=> goTo(el.dataset.go);
  });
  if(view==='eveningChoice'){
    const finishBtn = screenEl.querySelector('[data-finish-evening]');
    if(finishBtn){
      finishBtn.onclick = ()=>{ state.timeOfDay='morning'; goTo('home', {resetStack:true}); };
    }
  }
  screenEl.querySelectorAll('[data-upload-trigger]').forEach(el=>{
    el.onclick = ()=> document.getElementById('uploadInput').click();
  });
  const moreToggle = screenEl.querySelector('#moreToggle');
  if(moreToggle){ moreToggle.onclick = ()=> screenEl.querySelector('#moreRow').classList.toggle('open'); }
  screenEl.querySelectorAll('[data-profile]').forEach(el=>{
    el.onclick = ()=>{
      overlayEl.innerHTML = `<div style="background:var(--paper); border-radius:18px; padding:22px; color:var(--ink)">
        <div style="display:flex; justify-content:space-between; margin-bottom:10px"><b>個人</b><span id="profClose" style="cursor:pointer; font-size:20px; line-height:1">×</span></div>
        <p class="small" style="margin:0">這一頁還在規劃中。</p></div>`;
      overlayEl.style.display = 'flex';
      overlayEl.onclick = e=>{ if(e.target===overlayEl) closeRecap(); };
      overlayEl.querySelector('#profClose').onclick = closeRecap;
    };
  });
  screenEl.querySelectorAll('[data-camera-trigger]').forEach(el=>{
    el.onclick = ()=> document.getElementById('cameraInput').click();
  });
  screenEl.querySelectorAll('[data-toggle]').forEach(el=>{
    el.onclick = ()=>{
      const key = el.dataset.toggle;
      state.perms[key] = !state.perms[key];
      state.dirty = true;
      render(view);
    };
  });
  screenEl.querySelectorAll('[data-group]').forEach(group=>{
    group.querySelectorAll('.chip, .chip-age').forEach(chip=>{
      chip.onclick = ()=>{
        const g = group.dataset.group;
        const val = chip.dataset.val;
        if(g==='leave') state.routine.leave = val;
        if(g==='off') state.routine.off = val;
        if(g==='age') state.routine.age = val;
        if(g==='region') state.region = (state.region===val ? null : val);
        if(g!=='duration') state.dirty = true;
        if(g==='duration') state.eveningDuration = val;
        render(view);
      };
    });
  });
  if(view==='onboard3'){
    screenEl.querySelector('#onb3Next').onclick = async ()=>{
      // 通知權限必須在點擊當下要求（iOS 要求使用者手勢）
      if(state.perms.push && 'Notification' in window && Notification.permission==='default'){
        try{ await Notification.requestPermission(); }catch(_){}
      }
      goTo('onboard4');
    };
  }
  if(view==='onboard4'){
    const emailEl = screenEl.querySelector('#emailInput');
    const pwEl = screenEl.querySelector('#pwInput');
    const run = async (btn, mode)=>{
      const email = emailEl.value.trim(), password = pwEl.value;
      if(!email || password.length < 6){ alert('請輸入電子郵件，密碼至少 6 個字元'); return; }
      const label = btn.textContent;
      btn.textContent = '處理中...'; btn.disabled = true;
      try{
        const { data, error } = mode==='up'
          ? await sb.auth.signUp({ email, password })
          : await sb.auth.signInWithPassword({ email, password });
        if(error){ alert((mode==='up'?'註冊失敗：':'登入失敗：') + error.message); }
        else if(mode==='up' && !data.session){ alert('帳號已建立，但還需要驗證信箱，請確認後台已關閉 Confirm email。'); }
        else if(data.session && (mode==='up' || state.dirty)){ currentUser = data.session.user; finishOnboarding(); }
      }catch(err){ alert('發生錯誤：' + err.message); }
      finally{ btn.textContent = label; btn.disabled = false; }
    };
    screenEl.querySelector('#signUpBtn').onclick = e => run(e.currentTarget, 'up');
    screenEl.querySelector('#signInBtn').onclick = e => run(e.currentTarget, 'in');
  }
  if(view==='home'){
    // 隱藏開關：1.5 秒內連點首頁卡片的「今天的邀請」5 次，開啟 / 關閉測試模式（手機 PWA 沒有網址列時用）
    const eb = screenEl.querySelector('.invite-card .eyebrow');
    if(eb){
      let n = 0, t = 0;
      eb.onclick = ()=>{
        const now = Date.now(); n = (now - t < 1500) ? n + 1 : 1; t = now;
        if(n >= 5){
          n = 0;
          try{
            const on = localStorage.getItem('nb_dev') === '1';
            if(on) localStorage.removeItem('nb_dev'); else localStorage.setItem('nb_dev','1');
            alert(on ? '測試模式已關閉' : '測試模式已開啟');
          }catch(_){}
          location.reload();
        }
      };
    }
  }
  const saveBtn = screenEl.querySelector('#saveBtn');
  if(saveBtn){
    saveBtn.onclick = async ()=>{
      const noteEl = screenEl.querySelector('#noteInput');
      const note = noteEl ? noteEl.value.trim() : '';
      await saveEntry({
        note: note || null,
        species: saveBtn.dataset.species || null,
        confidence: saveBtn.dataset.confidence || null,
      });
      state.photos = [];
      await loadWeekEntries();
      goTo('home', {resetStack:true});
    };
  }
  if(view==='postCapture'){
    screenEl.querySelectorAll('[data-del]').forEach(el=>{
      el.onclick = ()=>{
        const idx = parseInt(el.dataset.del);
        state.photos.splice(idx,1);
        if(state.photos.length===0){ goBack(); }
        else{ render('postCapture'); }
      };
    });
  }
  screenEl.querySelectorAll('[data-recap-open]').forEach(el=>{
    el.onclick = ()=> openRecap(parseInt(el.dataset.recapOpen));
  });
}

async function loadProfile(){
  if(!currentUser) return;
  const { data } = await sb.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();
  if(!data) return;
  state.profile = data;
  if(state.dirty) return;   // 剛填完註冊資料、還沒存的時候，不要被舊資料蓋掉
  state.routine.leave = data.leave_time; state.routine.off = data.off_time; state.routine.age = data.age_bracket;
  state.perms.weekend = WEEKEND_FEATURE_READY ? (data.weekend_interest ?? true) : false;
  state.perms.push = data.push_enabled ?? true;
  state.region = data.region || null;
}
async function saveProfile(){
  if(!currentUser) return {ok:false, reason:'尚未登入'};
  const row = {
    id: currentUser.id,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'Asia/Taipei',
    weekend_interest: state.perms.weekend,
    push_enabled: state.perms.push,
    region: state.region || null,
  };
  if(state.routine.leave) row.leave_time = state.routine.leave;
  if(state.routine.off) row.off_time = state.routine.off;
  if(state.routine.age) row.age_bracket = state.routine.age;
  const { data, error } = await sb.from('profiles').upsert(row).select().single();
  if(error){ console.error('存設定失敗', error); return {ok:false, reason:error.message}; }
  state.profile = data; state.dirty = false;
  return {ok:true};
}

function urlB64ToUint8Array(b64){
  const s = (b64 + '='.repeat((4 - b64.length % 4) % 4)).replace(/-/g,'+').replace(/_/g,'/');
  return Uint8Array.from(atob(s), c => c.charCodeAt(0));
}
async function enablePush(){
  if(!currentUser) return {ok:false, reason:'尚未登入'};
  if(!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window))
    return {ok:false, reason:'這個環境不支援推播（iPhone 需要先加到主畫面再開啟）'};
  if(['localhost','127.0.0.1'].includes(location.hostname))
    return {ok:false, reason:'localhost 沒有註冊 Service Worker，推播請在 GitHub Pages 上測'};
  if(VAPID_PUBLIC_KEY.startsWith('PASTE'))
    return {ok:false, reason:'index.html 裡還沒填 VAPID 公鑰'};
  if(Notification.permission !== 'granted') return {ok:false, reason:'通知權限未開啟（' + Notification.permission + '）'};
  let reg = await navigator.serviceWorker.getRegistration();
  if(!reg) reg = await navigator.serviceWorker.register('sw.js');
  const swState = () => reg.active ? '已啟用' : reg.waiting ? '等待中（waiting）' : reg.installing ? '安裝中（installing）' : '沒有 Service Worker';
  if(!reg.active){
    // 等最多 8 秒；仍沒有啟用，就回報目前狀態，方便判斷是安裝失敗還是只是太慢
    await new Promise(res=>{
      const t = setTimeout(res, 8000);
      navigator.serviceWorker.ready.then(()=>{ clearTimeout(t); res(); });
    });
    if(!reg.active) throw new Error('Service Worker 還沒啟用，目前狀態：' + swState());
  }
  let sub = await reg.pushManager.getSubscription();
  if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey: urlB64ToUint8Array(VAPID_PUBLIC_KEY)});
  const j = sub.toJSON();
  const { error } = await sb.from('push_subscriptions').upsert({
    user_id: currentUser.id, endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth,
    user_agent: navigator.userAgent.slice(0,200), failed_count: 0
  }, {onConflict:'endpoint'});
  if(error) return {ok:false, reason:error.message};
  return {ok:true};
}
async function sendTestPush(){
  // 呼叫排程用的同一支函式（模擬模式）：用測試面板選的天氣與日期，挑句邏輯與每天早上的推播完全相同
  const { data, error } = await sb.functions.invoke('send-morning-push', {body:{simulate:true, weather: devOverride.weather, date: devOverride.date}});
  if(error) return {ok:false, reason:error.message};
  return data && data.sent > 0 ? {ok:true, sent:data.sent, text:data.text, lineId:data.lineId} : {ok:false, reason:(data && data.message) || '沒有可用的推播訂閱'};
}
// 存設定 →（有開提醒）訂閱推播 →（測試期）送一則測試推播。回傳每一步的結果文字，方便測試時看
async function saveSettingsFlow(){
  const log = [];
  const s = await saveProfile();
  log.push(s.ok ? '✓ 設定已存到 profiles' : '✗ 存設定失敗：' + s.reason);
  if(!s.ok) return log;
  if(state.perms.push){
    let p; try{ p = await enablePush(); }catch(e){ p = {ok:false, reason:e.message}; }
    log.push(p.ok ? '✓ 推播訂閱完成' : '✗ 推播訂閱：' + p.reason);
    if(p.ok && TEST_PUSH_AFTER_SAVE){
      let t; try{ t = await sendTestPush(); }catch(e){ t = {ok:false, reason:e.message}; }
      log.push(t.ok ? '✓ 測試推播已送出（' + t.sent + ' 台裝置）：' + t.text : '✗ 測試推播：' + t.reason);
      if(t.ok){
        const inv = todayInvitation();
        const local = inv.ids[1];
        const inv2 = invDate();
        log.push('條件：' + inv2.y + '-' + inv2.m + '-' + inv2.d + '、天氣=' + (devOverride.weather ? WEATHER_LABELS[devOverride.weather] : '未指定') + '、地區=' + (state.region || '未選'));
        log.push('句子 ID：伺服器 ' + t.lineId + (local ? '｜網頁預期 ' + local : '') + (local && local !== t.lineId ? '（兩邊不同）' : ''));
      }
    }
  }else{
    log.push('（提醒已關閉，不訂閱推播）');
  }
  console.log(log.join('\n'));
  return log;
}
async function finishOnboarding(){
  const log = await saveSettingsFlow();
  if(DEV) alert(log.join('\n'));
}

// ---- 開發測試面板（只在 DEV 顯示）----
function openDevPanel(){
  const optW = ['<option value="">自動（目前沒有天氣資料）</option>'].concat(
    Object.entries(WEATHER_LABELS).map(([k,v])=>`<option value="${k}" ${devOverride.weather===k?'selected':''}>${v}</option>`)).join('');
  const optR = ['<option value="">不選</option>'].concat(
    REGIONS.map(([k,v])=>`<option value="${k}" ${state.region===k?'selected':''}>${v}</option>`)).join('');
  overlayEl.innerHTML = `<div style="background:var(--paper); border-radius:18px; padding:18px; overflow:auto; font-size:13px; color:var(--ink)">
    <div style="display:flex; justify-content:space-between; margin-bottom:12px"><b>測試面板</b><span id="devClose" style="cursor:pointer; font-size:20px; line-height:1">×</span></div>
    <p class="small" style="margin:0 0 4px">天氣（手動指定）</p>
    <select id="dvWeather" style="width:100%; padding:8px; margin-bottom:10px">${optW}</select>
    <p class="small" style="margin:0 0 4px">地區（會存進 profiles）</p>
    <select id="dvRegion" style="width:100%; padding:8px; margin-bottom:10px">${optR}</select>
    <p class="small" style="margin:0 0 4px">日期（測節氣用，留空 = 今天）</p>
    <input id="dvDate" type="date" value="${devOverride.date||''}" style="width:100%; padding:8px; margin-bottom:12px">
    <button class="btn block" id="dvApply">套用並回首頁</button>
    <button class="btn ghost block" id="dvSave">存設定並送測試推播</button>
    <p class="small" id="dvMsg" style="white-space:pre-line; margin:6px 0 0"></p>
  </div>`;
  overlayEl.style.display = 'flex';
  overlayEl.onclick = e=>{ if(e.target===overlayEl) closeRecap(); };
  const $$ = id => overlayEl.querySelector(id);
  $$('#devClose').onclick = closeRecap;
  const readInputs = ()=>{
    devOverride.weather = $$('#dvWeather').value || null;
    devOverride.date = $$('#dvDate').value || null;
    const r = $$('#dvRegion').value || null;
    if(r !== state.region){ state.region = r; state.dirty = true; }
  };
  $$('#dvApply').onclick = ()=>{ readInputs(); closeRecap(); goTo('home', {resetStack:true}); };
  $$('#dvSave').onclick = async ()=>{
    readInputs();
    // 通知權限必須在點擊當下就要求（iOS 會擋掉非手勢觸發的詢問）
    if('Notification' in window && Notification.permission === 'default'){ try{ await Notification.requestPermission(); }catch(_){} }
    $$('#dvMsg').textContent = '處理中...';
    const log = await saveSettingsFlow();
    $$('#dvMsg').textContent = log.join('\n');
  };
}

// ---- 週回顧：Overlay（疊在目前畫面上，不切換頁面）----
const overlayEl = document.getElementById('overlay');
function openRecap(idx=0){
  if(!currentEntries().length) return;
  window.__recapIdx = idx; window.__photoIdx = 0;
  showRecap();
}
function closeRecap(){ overlayEl.style.display='none'; overlayEl.innerHTML=''; }
function showRecap(){
  overlayEl.innerHTML = views.recap();
  overlayEl.style.display = 'flex';
  overlayEl.onclick = e=>{ if(e.target===overlayEl) closeRecap(); };
  const q = sel=>overlayEl.querySelectorAll(sel);
  q('#closeRecap').forEach(el=>{ el.onclick = closeRecap; });
  q('#recapToGarden').forEach(el=>{ el.onclick = ()=>{ closeRecap(); goTo('gardenNear'); }; });
  q('[data-recap-nav]').forEach(el=>{
    el.onclick = ev=>{
      ev.stopPropagation();
      const n = currentEntries().length;
      window.__recapIdx = Math.max(0, Math.min(n-1, (window.__recapIdx ?? 0) + parseInt(el.dataset.recapNav)));
      window.__photoIdx = 0;
      showRecap();
    };
  });
  q('[data-photo-next]').forEach(el=>{
    el.onclick = ev=>{
      ev.stopPropagation();
      window.__photoIdx = ((window.__photoIdx ?? 0) + 1) % parseInt(el.dataset.photoNext);
      showRecap();
    };
  });
}

// swipe-up gesture: gardenNear -> gardenFull
let touchStartY = null;
screenEl.addEventListener('touchstart', e=>{ touchStartY = e.touches[0].clientY; });
screenEl.addEventListener('touchend', e=>{
  if(touchStartY===null) return;
  const dy = touchStartY - e.changedTouches[0].clientY;
  if(dy > 60 && screenEl.querySelector('.garden-plot') && !screenEl.querySelector('.garden-plot.full')){
    goTo('gardenFull');
  }
  touchStartY = null;
});

document.getElementById('uploadInput').onchange = (e)=>{
  // 從相簿上傳：算進「上傳當天」，不做日期調整；之後流程與拍照相同
  const files = Array.from(e.target.files || []);
  if(files.length){ state.photos.push(...files); }
  e.target.value = '';
  if(files.length) goTo('postCapture');
};

document.getElementById('cameraInput').onchange = (e)=>{
  const file = e.target.files[0];
  if(file){ state.photos.push(file); }
  e.target.value = '';
  goTo('postCapture');
};

if('serviceWorker' in navigator && !['localhost','127.0.0.1'].includes(location.hostname)){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(err=>console.warn('SW 註冊失敗', err)));
}

  (async ()=>{
  const { data } = await sb.auth.getSession();
  currentUser = data.session?.user ?? null;
  if(currentUser){ await loadWeekEntries(); await loadProfile(); }

  currentView = currentUser ? 'home' : 'onboard1';
  render(currentView);

  sb.auth.onAuthStateChange(async (event, session)=>{
    currentUser = session?.user ?? null;
    if(event === 'SIGNED_IN' && currentUser){
      await loadWeekEntries(); await loadProfile();
      if(currentView.startsWith('onboard')){ goTo('home', {resetStack:true}); }
    }
    if(event === 'SIGNED_OUT'){ goTo('onboard1', {resetStack:true}); }
  });
})();
