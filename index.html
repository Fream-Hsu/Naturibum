<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F4EEE1">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Naturibum">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Naturibum</title>
<style>
  :root{
    --cream:#F4EEE1; --cream-dusk:#EDE0C8;
    --ink:#3D4A32; --ink-soft:#6B6754; --muted:#8A8570; --muted-light:#B5AD94;
    --border:#DCD3BC; --sage-1:#A9C68A; --sage-2:#8FAE72; --sage-3:#6E9153;
    --terracotta:#D98B5F; --dusk-bg:#3D3426; --dusk-text:#F4EEE1; --paper:#FFFDF8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
    background:#E9E2D0; color:var(--ink); display:flex; justify-content:center; min-height:100vh;
  }
  #phone{
    width:100%; max-width:390px; min-height:100vh; background:var(--paper);
    position:relative; overflow:hidden; display:flex; flex-direction:column;
  }
  #screen{flex:1; display:flex; flex-direction:column; position:relative}
  .view{flex:1; display:flex; flex-direction:column; padding:1.5rem 1.25rem; animation:fadeIn .35s ease}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)}}
  @media (prefers-reduced-motion: reduce){ .view{animation:none} }

  .eyebrow{font-size:11px; color:var(--muted-light); margin:0 0 18px}
  h1{font-size:19px; font-weight:600; color:var(--ink); margin:0 0 14px; line-height:1.6}
  p.copy{font-size:14px; color:var(--ink-soft); line-height:1.8; margin:0 0 14px}
  p.small{font-size:12px; color:var(--muted); line-height:1.7}

  .btn{
    width:100%; border:none; border-radius:24px; padding:13px; font-size:14px;
    background:var(--terracotta); color:#FFF7EE; cursor:pointer; font-weight:500;
  }
  .btn:active{opacity:.85}
  .btn.ghost{background:#fff; color:var(--ink); border:1px solid var(--border)}
  .btn.block{margin-bottom:8px}
  .spacer{flex:1}

  .chip-row{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:20px}
  .chip{
    font-size:12px; padding:7px 12px; border-radius:16px; border:1px solid var(--border);
    color:var(--muted); background:#fff; cursor:pointer;
  }
  .chip.active{background:var(--terracotta); color:#FFF7EE; border-color:var(--terracotta)}
  .chip-age{
    display:flex; flex-direction:column; align-items:center; gap:2px; min-width:56px;
    font-size:13px; padding:8px 10px; border-radius:12px; border:1px solid var(--border);
    color:var(--muted); background:#fff; cursor:pointer;
  }
  .chip-age small{font-size:9px; color:var(--muted-light)}
  .chip-age.active{background:var(--terracotta); color:#FFF7EE; border-color:var(--terracotta)}
  .chip-age.active small{color:rgba(255,247,238,.8)}

  .toggle-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:22px}
  .toggle-row .label{font-size:13px; color:var(--ink)}
  .toggle-row .sub{font-size:11px; color:var(--muted-light); margin-top:3px}
  .switch{width:38px; height:21px; border-radius:11px; position:relative; cursor:pointer; transition:.2s}
  .switch .knob{width:17px; height:17px; background:#fff; border-radius:50%; position:absolute; top:2px; transition:.2s}
  .switch.off{background:var(--border)} .switch.off .knob{left:2px}
  .switch.on{background:var(--sage-2)} .switch.on .knob{left:19px}

  .dots{display:flex; gap:6px; justify-content:center; margin-top:14px}
  .dots span{width:6px; height:6px; border-radius:50%; background:var(--border)}
  .dots span.on{background:var(--terracotta)}

  /* camera */
  .cam-circle{
    width:72px; height:72px; border-radius:50%; background:var(--cream); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; margin:auto; font-size:28px;
  }
  .thumb-row{display:flex; gap:6px; margin-bottom:14px; overflow-x:auto}
  .thumb{width:46px; height:46px; border-radius:8px; background:var(--cream-dusk); flex-shrink:0; position:relative}
  .thumb-del{
    position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%;
    background:#fff; border:1px solid var(--border); font-size:11px; line-height:16px;
    text-align:center; color:var(--muted); cursor:pointer;
  }

  /* dusk screens */
  .dusk{background:var(--dusk-bg); color:var(--dusk-text); margin:-1.5rem -1.25rem; padding:1.5rem 1.25rem; flex:1; display:flex; flex-direction:column}
  .dusk .eyebrow{color:rgba(244,238,225,.5)}
  .dusk .copy{color:rgba(244,238,225,.85)}
  .progress{display:flex; gap:4px; margin-bottom:16px}
  .progress div{flex:1; height:3px; border-radius:2px; background:rgba(255,255,255,.35)}
  .progress div.done{background:rgba(255,255,255,.9)}
  .story-photo{
    aspect-ratio:1; border-radius:12px; background:rgba(255,255,255,.08); position:relative;
    display:flex; align-items:center; justify-content:center; font-size:34px; margin-bottom:14px;
  }
  .badge{position:absolute; top:8px; right:8px; background:rgba(0,0,0,.5); border-radius:10px; padding:3px 9px; font-size:10px}
  .story-nav{position:absolute; top:0; bottom:0; width:35%}
  .id-tag{font-size:11px; color:var(--terracotta); margin-bottom:6px}

  /* garden */
  .garden-plot{
    background:var(--cream); border-radius:16px; padding:1.25rem; margin-bottom:16px; position:relative; overflow:hidden;
  }
  .garden-plot.full{border:2px dashed var(--border)}
  .plants{display:flex; align-items:flex-end; justify-content:space-around; height:120px; font-size:34px; margin-bottom:6px}
  .ghost-plant{position:absolute; bottom:14px; right:16px; font-size:30px; opacity:.22}
  .swipe-hint{text-align:center; font-size:11px; color:var(--muted-light); margin-top:4px}
  .current-week{position:relative; display:inline-block}
  .current-week::after{
    content:''; position:absolute; inset:-9px; border:2px solid var(--terracotta); border-radius:50%;
  }

  /* —— 對齊 Figma（frames 5 / 8 / 9 / 10）—— */
  #backBtn + .view .eyebrow{padding-left:36px}
  .plant-svg{filter:drop-shadow(1px 2px 1.5px rgba(61,46,26,.22))}
  .invite-card{
    position:relative; min-height:176px; background:var(--cream); border-radius:18px; padding:18px 18px 16px;
    display:flex; flex-direction:column; justify-content:space-between;
    box-shadow:0 6px 14px rgba(61,52,38,.16), 0 1px 2px rgba(61,52,38,.1);
  }
  .invite-card h1{font-size:17px; margin:0}
  .invite-ghost{position:absolute; top:8px; right:10px; opacity:.3; pointer-events:none}
  .cam-circle.big{
    width:96px; height:96px; border:none;
    box-shadow:6px 8px 16px rgba(61,52,38,.2), -4px -4px 10px rgba(255,255,255,.75);
  }
  .week-head{display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-bottom:8px}
  .week-card{
    background:var(--cream); border-radius:14px; padding:14px 12px 10px; min-height:64px;
    display:flex; gap:10px; align-items:flex-end; overflow-x:auto;
    box-shadow:0 4px 10px rgba(61,52,38,.14);
  }
  .hero-photo{aspect-ratio:1; border-radius:14px; background:var(--cream-dusk) center/cover; margin-bottom:14px}
  #backBtn + .view .hero-photo{margin-top:36px}
  .story-photo{overflow:hidden}
  .badge{z-index:2; cursor:pointer}
  .garden-plot.near{background:none; padding:0; overflow:visible; margin-bottom:8px}
  .garden-plot.near .ghost-plant{top:0; bottom:auto; right:0; opacity:.3}
  .swipe-hint{line-height:1.9}

  #overlay{position:absolute; inset:0; z-index:30; display:none; flex-direction:column; padding:14px 12px; background:rgba(20,16,10,.62); animation:fadeIn .25s ease}
  #overlay .dusk{margin:0; border-radius:18px; overflow:hidden}

  /* nav bar (prototype helper) */
  #devnav{
    display:flex; border-top:1px solid var(--border); background:#fff;
  }
  #devnav button{
    flex:1; border:none; background:none; padding:11px 4px; font-size:10.5px; color:var(--muted);
    cursor:pointer; border-top:2px solid transparent;
  }
  #devnav button.active{color:var(--terracotta); border-top-color:var(--terracotta)}
  #devnav button#todToggle{color:var(--muted-light); font-size:10px; border-left:1px solid var(--border)}
</style>
</head>

function getWeekStartISO(d=new Date()){
  const day = d.getDay();
  const diff = (day===0 ? -6 : 1) - day;
  const monday = new Date(d);
  monday.setDate(d.getDate()+diff);
  monday.setHours(0,0,0,0);
  return monday.toISOString().slice(0,10);
}

async function saveEntry({note=null, species=null, confidence=null}){
  if(!currentUser){ console.warn('未登入，這則不會存進 Supabase，僅本機顯示'); return null; }
  const { data, error } = await sb.from('entries').insert({
    user_id: currentUser.id, note: note||null, species, ai_confidence: confidence,
    week_start: getWeekStartISO()
  }).select().single();
  if(error){ console.error(error); return null; }

  for(let i=0; i<state.photos.length; i++){
    const file = state.photos[i];
    const path = `${currentUser.id}/${data.id}/${i}-${Date.now()}.jpg`;
    const { error: upErr } = await sb.storage.from('entry-photos').upload(path, file);
    if(upErr){ console.error('照片上傳失敗', upErr); continue; }
    await sb.from('entry_photos').insert({ entry_id: data.id, storage_path: path, sort_order: i });
  }
  return data;
}

let weekEntries = [];
async function loadWeekEntries(){
  if(!currentUser){ weekEntries = []; return; }
  const { data, error } = await sb.from('entries').select('*, entry_photos(storage_path, sort_order)')
    .eq('user_id', currentUser.id).eq('week_start', getWeekStartISO()).order('created_at');
  weekEntries = error ? [] : (data||[]);
  const paths = weekEntries.flatMap(e => (e.entry_photos||[]).sort((a,b)=>a.sort_order-b.sort_order).map(p=>p.storage_path));
  if(paths.length){
    const { data: signed } = await sb.storage.from('entry-photos').createSignedUrls(paths, 3600);
    const map = Object.fromEntries((signed||[]).filter(x=>x.signedUrl).map(x=>[x.path, x.signedUrl]));
    weekEntries.forEach(e => { e.urls = (e.entry_photos||[]).map(p=>map[p.storage_path]).filter(Boolean); });
  }
}

const DEV = ['localhost','127.0.0.1'].includes(location.hostname) || new URLSearchParams(location.search).has('dev');
const $ = sel => document.querySelector(sel);
const screenEl = $('#screen');
const devnavEl = $('#devnav');

let state = {
  onboardDone: false,
  timeOfDay: 'morning',

const demoEntries = [
  {id:1, kind:'plain', text:'早上多繞了一小段路', photos:1},
  {id:2, kind:'id', species:'鬼針草', text:'週三，下班路上，蹲下來看了一叢鬼針草', photos:3},

// ---- 花圃 SVG 插畫：酢漿草三葉（俯視）。一則紀錄 = 一株三葉；辨識過帶葉脈；寫了文字才開花 ----
const CAM_SVG = `<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#3D4A32" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>`;
const CHEV = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#8A8570" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l5-4 5 4M3 12l5-4 5 4"/></svg>`;
const LEAF_L = 'M0,0 C-17,-9 -24,-24 -13,-35 Q-4,-39 0,-32 Q4,-16 0,0Z';
const LEAF_R = 'M0,0 Q4,-16 0,-32 Q4,-39 13,-35 C24,-24 17,-9 0,0Z';
function cloverG(identified, ghost=false){
  const vein = identified && !ghost ? '<path d="M0,-4 L0,-29" stroke="#6E9153" stroke-width="1.3" fill="none" stroke-linecap="round"/>' : '';
  const line = 'fill="none" stroke="#6E9153" stroke-width="1.2"';
  const l = ghost ? line : 'fill="#8FAE72"', r = ghost ? line : 'fill="#819D67"';
  return [-60,60,180].map(a=>`<g transform="rotate(${a})"><path d="${LEAF_L}" ${l}/><path d="${LEAF_R}" ${r}/>${vein}</g>`).join('');
}
function flowerG(r){
  const petals = [0,72,144,216,288].map(a=>`<circle cy="${-r*0.62}" r="${r*0.5}" fill="#F2C94C" transform="rotate(${a})"/>`).join('');
  return petals + `<circle r="${r*0.28}" fill="#E8A33D"/>`;
}
function plantIcon(entry, size=30){
  const id = entry.kind==='id', note = !!(entry.text && entry.text.trim());
  const stalk = note ? `<path d="M30,42 L30,17" stroke="#6E9153" stroke-width="1.4"/><g transform="translate(30,12)">${flowerG(8)}</g>` : '';
  return `<svg class="plant-svg" width="${size}" height="${size*1.27}" viewBox="0 0 60 76">
    <path d="M30,75 Q33,58 30,42" stroke="#6E9153" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    ${stalk}<g transform="translate(30,42) scale(.7)">${cloverG(id)}</g></svg>`;
}
function ghostLeafIcon(size=70){
  return `<svg width="${size}" height="${size}" viewBox="-45 -45 90 90">${cloverG(false,true)}</svg>`;
}
// 本週近景：一週一株，每則紀錄一根莖＋一組三葉；
// 只有 1 則附文字 → 頂端一朵大花；多則附文字 → 各自葉腋旁一朵小花
function weekPlantSVG(entries){
  const n = entries.length, bx = 150, by = 285;
  const pts = entries.map((e,i)=>{
    const t = n===1 ? 0 : (i/(n-1)-.5)*2;
    const a = t*50*Math.PI/180, L = 170 - Math.abs(t)*50;
    const tx = bx+L*Math.sin(a), ty = by-L*Math.cos(a);
    return {e, t, tx, ty, cx: bx+(tx-bx)*.15, cy: by-L*.6};
  });
  const flowering = pts.filter(p=>p.e.text && p.e.text.trim());
  const stems = pts.map(p=>`<path d="M${bx},${by} Q${p.cx},${p.cy} ${p.tx},${p.ty}" stroke="#6E9153" stroke-width="2" fill="none" stroke-linecap="round"/>`).join('');
  const clovers = pts.map(p=>`<g transform="translate(${p.tx},${p.ty}) rotate(${p.t*30}) scale(1.1)">${cloverG(p.e.kind==='id')}</g>`).join('');
  let flowers = '';
  if(flowering.length===1){
    flowers = `<path d="M${bx},${by} L${bx},50" stroke="#6E9153" stroke-width="2"/><g transform="translate(${bx},34)">${flowerG(22)}</g>`;
  }else{
    flowers = flowering.map(p=>{
      const u=.72, k=1-u;
      const x = k*k*bx+2*k*u*p.cx+u*u*p.tx, y = k*k*by+2*k*u*p.cy+u*u*p.ty, dx = p.t>=0 ? 16 : -16;
      return `<path d="M${x},${y} L${x+dx},${y-8}" stroke="#6E9153" stroke-width="1.5"/><g transform="translate(${x+dx},${y-12})">${flowerG(11)}</g>`;
    }).join('');
  }
  return `<svg class="plant-svg" viewBox="0 0 300 300" width="100%" style="display:block">
    <ellipse cx="150" cy="212" rx="128" ry="82" fill="#EDE0C8" opacity=".7"/>${stems}${clovers}${flowers}</svg>`;
}
function treeIcon(size=44){
  return `<svg width="${size}" height="${size}" viewBox="0 0 36 36">
    <rect x="16" y="24" width="4" height="11" fill="var(--sage-3)"/>
    <circle cx="18" cy="15" r="12" fill="var(--sage-2)"/>
    <circle cx="10" cy="12" r="7" fill="var(--sage-1)"/>
    <circle cx="26" cy="12" r="7" fill="var(--sage-1)"/>
  </svg>`;
}

function currentEntries(){
  const source = (currentUser && weekEntries.length) ? weekEntries : demoEntries;
  return source.map(e => 'note' in e
    ? { kind: e.species ? 'id':'plain', species: e.species, text: e.note||'', photos: (e.entry_photos||[]).length||1, urls: e.urls||[] }

  );
}

function miniPlantsHTML(){
  return currentEntries().map((e,idx)=>
    `<span data-recap-open="${idx}" style="cursor:pointer">${plantIcon(e)}</span>`

let currentView = 'onboard1';
let navStack = [];
const duskViews = new Set(['recap','eveningPlay']);

function goTo(view, opts={}){
  const rootViews = new Set(['home','gardenNear']);
  if(opts.resetStack || rootViews.has(view)){ navStack = []; }
  else{ navStack.push(currentView); }
  currentView = view;
  render(view);
}

function goBack(){
  const prev = navStack.pop();
  if(prev){ currentView = prev; render(prev); }
}

function render(view){
  const isDusk = duskViews.has(view);
  const backBtn = navStack.length ? `
    <div id="backBtn" style="position:absolute; top:16px; left:16px; z-index:5; width:30px; height:30px;
      border-radius:50%; background:${isDusk?'rgba(255,255,255,.14)':'rgba(0,0,0,.06)'};
      display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:17px;
      color:${isDusk?'#F4EEE1':'var(--ink-soft)'}">‹</div>` : '';
  screenEl.innerHTML = backBtn + views[view]();
  bind(view);
  renderDevNav(view);
  if(navStack.length){ document.getElementById('backBtn').onclick = goBack; }
}

function renderDevNav(current){
  if(!DEV){ devnavEl.style.display = 'none'; return; }
  const tabs = [ ['onboard1','註冊'], ['home','首頁'], ['gardenNear','花圃'] ];
  devnavEl.innerHTML = tabs.map(([k,label]) =>
    `<button data-jump="${k}" class="${current.startsWith(k.replace(/[0-9]/g,''))?'active':''}">${label}</button>`
  ).join('') + `<button id="todToggle" title="開發用:模擬系統時段切換">${state.timeOfDay==='evening'?'🌙 傍晚模式':'🌞 早晨模式'}</button>`;
  devnavEl.querySelectorAll('button[data-jump]').forEach(b=>{
    b.onclick = ()=> goTo(b.dataset.jump, {resetStack:true});
  });
  document.getElementById('todToggle').onclick = ()=>{
    state.timeOfDay = state.timeOfDay==='evening' ? 'morning' : 'evening';
    goTo('home', {resetStack:true});
  };
}

function bind(view){

      finishBtn.onclick = ()=>{ state.timeOfDay='morning'; goTo('home', {resetStack:true}); };
    }
  }
  screenEl.querySelectorAll('[data-camera-trigger]').forEach(el=>{
    el.onclick = ()=> document.getElementById('cameraInput').click();
  });
  screenEl.querySelectorAll('[data-toggle]').forEach(el=>{
    el.onclick = ()=>{
      const key = el.dataset.toggle;
      state.perms[key] = !state.perms[key];
      render(view);
    };
  });
  screenEl.querySelectorAll('[data-group]').forEach(group=>{
    group.querySelectorAll('.chip, .chip-age').forEach(chip=>{
      chip.onclick = ()=>{
        const g = group.dataset.group;
        const val = chip.dataset.val;
        if(g==='leave') state.routine.leave = val;
        if(g==='off') state.routine.off = val;
        if(g==='age') state.routine.age = val;
        if(g==='duration') state.eveningDuration = val;
        render(view);
      };
    });
  });
  if(view==='onboard4'){
    const emailEl = screenEl.querySelector('#emailInput');
    const pwEl = screenEl.querySelector('#pwInput');
    const run = async (btn, mode)=>{
      const email = emailEl.value.trim(), password = pwEl.value;
      if(!email || password.length < 6){ alert('請輸入電子郵件，密碼至少 6 個字元'); return; }
      const label = btn.textContent;
      btn.textContent = '處理中...'; btn.disabled = true;
      try{
        const { data, error } = mode==='up'
          ? await sb.auth.signUp({ email, password })
          : await sb.auth.signInWithPassword({ email, password });
        if(error){ alert((mode==='up'?'註冊失敗：':'登入失敗：') + error.message); }
        else if(mode==='up' && !data.session){ alert('帳號已建立，但還需要驗證信箱，請確認後台已關閉 Confirm email。'); }
      }catch(err){ alert('發生錯誤：' + err.message); }
      finally{ btn.textContent = label; btn.disabled = false; }
    };
    screenEl.querySelector('#signUpBtn').onclick = e => run(e.currentTarget, 'up');
    screenEl.querySelector('#signInBtn').onclick = e => run(e.currentTarget, 'in');

  //     };
  //   });
  //   const emailBtn = screenEl.querySelector('#emailLoginBtn');
  //   if(emailBtn){
  //     emailBtn.onclick = async ()=>{
  //       const email = screenEl.querySelector('#emailInput').value.trim();
  //       if(!email){ alert('請輸入電子郵件'); return; }
  //       emailBtn.textContent = '傳送中...';
  //       emailBtn.disabled = true;
  //       try{
  //         const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: location.origin + location.pathname } });
  //         if(error){ alert('發送失敗：'+error.message); }
  //         else{ alert('登入連結已寄出，請到信箱點擊完成註冊。'); }
  //       }catch(err){
  //         alert('發生錯誤，可能是網路或 CORS 問題：'+err.message);
  //       }finally{
  //         emailBtn.textContent = '完成註冊';
  //         emailBtn.disabled = false;
  //       }
  //     };
  //   }
  }
  const saveBtn = screenEl.querySelector('#saveBtn');
  if(saveBtn){
    saveBtn.onclick = async ()=>{
      const noteEl = screenEl.querySelector('#noteInput');
      const note = noteEl ? noteEl.value.trim() : '';
      await saveEntry({
        note: note || null,
        species: saveBtn.dataset.species || null,
        confidence: saveBtn.dataset.confidence || null,
      });
      state.photos = [];
      await loadWeekEntries();
      goTo('home', {resetStack:true});
    };
  }
  if(view==='postCapture'){
    screenEl.querySelectorAll('[data-del]').forEach(el=>{
      el.onclick = ()=>{
        const idx = parseInt(el.dataset.del);
        state.photos.splice(idx,1);
        if(state.photos.length===0){ goBack(); }
        else{ render('postCapture'); }
      };
    });
  }
  screenEl.querySelectorAll('[data-recap-open]').forEach(el=>{
    el.onclick = ()=> openRecap(parseInt(el.dataset.recapOpen));
  });
}

// ---- 週回顧：Overlay（疊在目前畫面上，不切換頁面）----
const overlayEl = document.getElementById('overlay');
function openRecap(idx=0){
  if(!currentEntries().length) return;
  window.__recapIdx = idx; window.__photoIdx = 0;
  showRecap();
}
function closeRecap(){ overlayEl.style.display='none'; overlayEl.innerHTML=''; }
function showRecap(){
  overlayEl.innerHTML = views.recap();
  overlayEl.style.display = 'flex';
  overlayEl.onclick = e=>{ if(e.target===overlayEl) closeRecap(); };
  const q = sel=>overlayEl.querySelectorAll(sel);
  q('#closeRecap').forEach(el=>{ el.onclick = closeRecap; });
  q('#recapToGarden').forEach(el=>{ el.onclick = ()=>{ closeRecap(); goTo('gardenNear'); }; });
  q('[data-recap-nav]').forEach(el=>{
    el.onclick = ev=>{
      ev.stopPropagation();
      const n = currentEntries().length;
      window.__recapIdx = Math.max(0, Math.min(n-1, (window.__recapIdx ?? 0) + parseInt(el.dataset.recapNav)));
      window.__photoIdx = 0;
      showRecap();
    };
  });
  q('[data-photo-next]').forEach(el=>{
    el.onclick = ev=>{
      ev.stopPropagation();
      window.__photoIdx = ((window.__photoIdx ?? 0) + 1) % parseInt(el.dataset.photoNext);
      showRecap();
    };
  });
}

// swipe-up gesture: gardenNear -> gardenFull
let touchStartY = null;
screenEl.addEventListener('touchstart', e=>{ touchStartY = e.touches[0].clientY; });
screenEl.addEventListener('touchend', e=>{
  if(touchStartY===null) return;
  const dy = touchStartY - e.changedTouches[0].clientY;
  if(dy > 60 && screenEl.querySelector('.garden-plot') && !screenEl.querySelector('.garden-plot.full')){
    goTo('gardenFull');
  }
  touchStartY = null;
});

document.getElementById('cameraInput').onchange = (e)=>{
  const file = e.target.files[0];
  if(file){ state.photos.push(file); }
  e.target.value = '';
  goTo('postCapture');
};

if('serviceWorker' in navigator && !['localhost','127.0.0.1'].includes(location.hostname)){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(err=>console.warn('SW 註冊失敗', err)));
}

})();
